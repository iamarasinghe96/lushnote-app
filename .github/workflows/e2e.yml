name: e2e

# The browser suite, against the app running on the runner in local mode:
# Firebase's emulators with made-up data, and the production build served by
# `next start` (scripts/dev-local.mjs --prod).
#
# It used to wait for Vercel's preview and test that, which meant every run
# signed in to the LIVE Firebase project and created and deleted a test patient
# in the same database doctors use. The owner chose local databases over a
# second Firebase project for staging, so the suite now never touches live
# data, needs no secrets, and does not wait for Vercel.
#
# What this no longer covers: Vercel's own environment (its variables, its
# headers as deployed). The preview is still built for every pull request and
# is still there to look at.

on:
  pull_request:
    branches: [main]
  # Same reason as in quality.yml: a dropped pull_request event otherwise
  # leaves the check unrecoverable without a new commit.
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id is the name branch protection requires — keep it stable.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The Firestore and Storage emulators are Java programs and need 21+.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start LushNote in local mode
        run: |
          node scripts/dev-local.mjs --reset --prod > local-mode.log 2>&1 &
          # The build takes a couple of minutes; then the server answers.
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:3000/api/version > /dev/null 2>&1; then echo "local mode is up"; exit 0; fi
            sleep 5
          done
          echo "::error::Local mode did not start. The log is attached to this run."
          tail -n 80 local-mode.log
          exit 1

      # The fixture account is made up and lives only in the emulator, so its
      # password is not a secret: scripts/seed-local.mjs creates it.
      - name: Playwright
        env:
          BASE_URL: http://127.0.0.1:3000
          E2E_USER_EMAIL: e2e-tester@lushnote.com.au
          E2E_USER_PASSWORD: local-e2e-password
        run: npx playwright test

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            local-mode.log
          retention-days: 7
