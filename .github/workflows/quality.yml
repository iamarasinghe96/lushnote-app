name: quality

# Types, unit tests and the Firestore security rules. None of them needs a
# Firebase project, a Stripe key or an AI key, so this workflow holds no secrets
# at all and reports in about two minutes — it is the check that should fail
# first when something is simply wrong.
#
# The rules run against the real emulator, which is the only way to test them:
# they cannot be typechecked, and the browser suite signs in as an
# already-onboarded fixture account, so it never walks the stub-then-complete
# path that broke every new signup.

on:
  pull_request:
    branches: [main]

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id is the name branch protection requires — keep it stable.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      # The emulator is a Java process; the runner already has a JDK.
      - name: Firestore rules
        run: npm run test:rules
