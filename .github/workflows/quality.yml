name: quality

# Types, unit tests and the Firestore security rules. None of them needs a
# Firebase project, a Stripe key or an AI key, so this workflow holds no secrets
# at all and reports in about two minutes — it is the check that should fail
# first when something is simply wrong.
#
# The rules run against the real emulator, which is the only way to test them:
# they cannot be typechecked, and the browser suite signs in as an
# already-onboarded fixture account, so it never walks the stub-then-complete
# path that broke every new signup.

on:
  pull_request:
    branches: [main]
  # A dropped pull_request event left this check unrecoverable. GitHub created
  # no run for one commit, and since pull_request was the only trigger, the only
  # way to get one was a new commit — which changes the sha and discards the
  # browser-suite result that had already passed against it. Promote then stays
  # disabled on a branch where nothing is actually wrong.
  #
  # Dispatch reads its trigger list from the DEFAULT branch, so this does
  # nothing until it is promoted; it exists for the next time, not this one.
  workflow_dispatch:

concurrency:
  # Keyed on the ref, so a manual run on the branch and the pull request's own
  # run do not cancel each other — the manual one exists precisely because the
  # automatic one is missing.
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The job id is the name branch protection requires — keep it stable.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:unit

      # firebase-tools refuses any JDK older than 21, and the runner's default is
      # older than that. Pinning it here rather than relying on whatever the
      # image ships means the emulator cannot stop working because GitHub
      # changed a default.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Firestore rules
        run: npm run test:rules
